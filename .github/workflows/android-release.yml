name: JARVIS AI Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to run manually'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    outputs:
      debug_apk_sha256: ${{ steps.verify_debug_apk.outputs.sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36.1 build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore for CI..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        id: gradle_debug
        run: |
          set -o pipefail
          mkdir -p build-logs
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-logs/debug-build.log
          else
            gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-logs/debug-build.log
          fi

      - name: Verify Debug APK & Generate Checksum
        id: verify_debug_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          mkdir -p debug-artifacts
          cp "$APK_PATH" "debug-artifacts/JARVIS-AI-debug.apk"
          echo "$APK_SHA256  JARVIS-AI-debug.apk" > "debug-artifacts/JARVIS-AI-debug.apk.sha256"

          {
            echo "### JARVIS AI — Debug Build Succeeded"
            echo "- **Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Artifact:** \`JARVIS-AI-debug.apk\` (${APK_SIZE})"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk-${{ github.ref_name }}
          path: debug-artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debug Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-failure-logs-${{ github.run_id }}
          path: |
            build-logs/
            app/build/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write Failure Summary
        if: failure()
        run: |
          {
            echo "### JARVIS AI — Debug Build Failed"
            echo "Check the \`jarvis-ai-debug-failure-logs-${{ github.run_id }}\` artifact or step logs above."
            if [ -f build-logs/debug-build.log ]; then
              echo ""
              echo "<details><summary>Last 60 lines of Gradle output</summary>"
              echo ""
              echo '```text'
              tail -n 60 build-logs/debug-build.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_variant == 'release')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36.1 build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine Release Tag & Version
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_nightly=false" >> $GITHUB_OUTPUT
          else
            VN="1.0.0"
            if [ -f version.properties ]; then
              VN=$(grep "VERSION_NAME" version.properties | cut -d'=' -f2 | tr -d '[:space:]' || echo "1.0.0")
            fi
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "version_name=$VN" >> $GITHUB_OUTPUT
          fi

      - name: Validate Signing Secrets & Decode Keystore
        id: signing_setup
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, and ANDROID_KEY_PASSWORD in Repository Secrets."
            {
              echo "### JARVIS AI — Release Signing Setup Failed"
              echo "Missing one or more required GitHub Repository Secrets:"
              echo "- \`ANDROID_KEYSTORE_BASE64\`"
              echo "- \`ANDROID_STORE_PASSWORD\`"
              echo "- \`ANDROID_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          KEYSTORE_FILE="${{ runner.temp }}/release-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded release keystore is empty. Verify ANDROID_KEYSTORE_BASE64 contains valid base64."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Ensure ANDROID_STORE_PASSWORD is correct and the keystore contains key alias 'upload' (required by app/build.gradle.kts)."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release keystore verified (alias 'upload' present)."

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-logs/release-build.log
          else
            gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-logs/release-build.log
          fi

      - name: Verify APK Signature & Prepare Release Assets
        id: prepare_assets
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK not found at $RELEASE_APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$RELEASE_APK"
          else
            echo "::warning::apksigner not found; skipping explicit signature verification."
          fi

          TAG_LABEL="${{ steps.release_meta.outputs.tag }}"
          if [ "$TAG_LABEL" = "nightly" ]; then
            TAG_LABEL="nightly-${{ steps.release_meta.outputs.version_name }}"
          fi
          if [ -z "$TAG_LABEL" ]; then
            TAG_LABEL="${GITHUB_REF_NAME}"
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]] && [ "$TAG_LABEL" = "${GITHUB_REF_NAME}" ]; then
            TAG_LABEL="manual-${GITHUB_RUN_NUMBER}"
          fi

          ASSET_NAME="JARVIS-AI-${TAG_LABEL}.apk"
          mkdir -p release-artifacts
          cp "$RELEASE_APK" "release-artifacts/${ASSET_NAME}"

          APK_SIZE=$(du -h "release-artifacts/${ASSET_NAME}" | cut -f1)
          APK_SHA256=$(sha256sum "release-artifacts/${ASSET_NAME}" | awk '{print $1}')
          echo "$APK_SHA256  ${ASSET_NAME}" > "release-artifacts/${ASSET_NAME}.sha256"

          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

          {
            echo "### JARVIS AI — Release Build Succeeded"
            echo "- **Release Tag:** \`${{ steps.release_meta.outputs.tag }}\`"
            echo "- **Signed APK:** \`${ASSET_NAME}\` (${APK_SIZE})"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-apk-${{ steps.release_meta.outputs.tag }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: JARVIS AI ${{ steps.release_meta.outputs.tag }} (${{ steps.release_meta.outputs.version_name || github.ref_name }})
          generate_release_notes: true
          prerelease: ${{ steps.release_meta.outputs.is_nightly }}
          make_latest: ${{ !steps.release_meta.outputs.is_nightly }}
          fail_on_unmatched_files: true
          body: |
            ## JARVIS AI — ${{ steps.release_meta.outputs.tag }}

            **Signed Android Release APK**
            - **APK:** `${{ steps.prepare_assets.outputs.asset_name }}` (${{ steps.prepare_assets.outputs.apk_size }})
            - **SHA-256:** `${{ steps.prepare_assets.outputs.apk_sha256 }}`
            - **Debug Build SHA-256:** `${{ needs.build-debug.outputs.debug_apk_sha256 }}`

            ### Installation
            1. Download `${{ steps.prepare_assets.outputs.asset_name }}` below.
            2. On your Android device, enable **Install unknown apps** if prompted and open the APK to install.
            3. Or install via ADB:
               ```bash
               adb install -r ${{ steps.prepare_assets.outputs.asset_name }}
               ```
          files: |
            release-artifacts/${{ steps.prepare_assets.outputs.asset_name }}
            release-artifacts/${{ steps.prepare_assets.outputs.asset_name }}.sha256

      - name: Upload Release Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-failure-logs-${{ github.run_id }}
          path: |
            build-logs/
            app/build/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write Release Failure Summary
        if: failure()
        run: |
          {
            echo "### JARVIS AI — Release Build Failed"
            echo "Check the \`jarvis-ai-release-failure-logs-${{ github.run_id }}\` artifact or workflow logs workflow files."
            if [ -f build-logs/release-build.log ]; then
              echo ""
              echo "<details><summary>Last 60 lines of Gradle output</summary>"
              echo ""
              echo '```text'
              tail -n 60 build-logs/release-build.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Decoded Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release-keystore.jks"
